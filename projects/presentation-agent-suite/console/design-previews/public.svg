<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">브리핑 — 쟁점과 판단을 정리한 공식 보고</title>
  <desc id="desc">남색 제목 띠와 쟁점, 근거, 결정 세 열의 표로 정보를 정리한 스타일 예시.</desc>
  <rect width="640" height="360" fill="#F1F3F9"/><rect width="640" height="100" fill="#243F70"/>
  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="32" y="32" fill="#C6D1F3" font-size="13" font-weight="700" letter-spacing="2">BRIEFING / ISSUES &amp; ACTIONS</text>
    <text x="32" y="75" fill="#FFFFFF" font-size="31" font-weight="750">쟁점에서 결정까지, 명료하게</text>
    <rect x="32" y="126" width="576" height="39" fill="#596DB5"/>
    <text x="50" y="152" fill="#FFFFFF" font-size="16" font-weight="700">검토 쟁점</text><text x="243" y="152" fill="#FFFFFF" font-size="16" font-weight="700">확인할 근거</text><text x="450" y="152" fill="#FFFFFF" font-size="16" font-weight="700">결정과 조치</text>
    <rect x="32" y="166" width="576" height="49" fill="#FFFFFF"/><rect x="32" y="216" width="576" height="49" fill="#E6EAF5"/><rect x="32" y="266" width="576" height="38" fill="#FFFFFF"/>
    <path d="M219 126 V304 M426 126 V304" fill="none" stroke="#CFD7EC" stroke-width="1"/>
    <text x="50" y="196" fill="#243F70" font-size="15">배경과 필요성</text><text x="243" y="196" fill="#4A5A7A" font-size="15">관측된 사실</text><text x="450" y="196" fill="#243F70" font-size="15">추진 방향</text>
    <text x="50" y="246" fill="#243F70" font-size="15">영향과 제약</text><text x="243" y="246" fill="#4A5A7A" font-size="15">대안별 검토</text><text x="450" y="246" fill="#243F70" font-size="15">우선 조치</text>
    <text x="50" y="291" fill="#243F70" font-size="15">실행 조건</text><text x="243" y="291" fill="#4A5A7A" font-size="15">담당과 일정</text><text x="450" y="291" fill="#243F70" font-size="15">확인 사항</text>
    <text x="32" y="336" fill="#4A5A7A" font-size="12">스타일 미리보기 · 예시 구조</text><text x="584" y="336" fill="#4A5A7A" font-size="12">07</text>
  </g>
</svg>
